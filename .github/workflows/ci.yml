name: CI

on: [push]

jobs:
  build:
    runs-on: bp-ubuntu-latest-x64-2x
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Erlang + Elixir
      uses: erlef/setup-beam@v1
      with:
        otp-version: 25.3
        elixir-version: 1.14.3

    - name: Restore Dependencies Cache
      uses: actions/cache@v3
      with:
        path: deps
        key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-mix-

    - name: Install Dependencies
      run: mix deps.get

    - name: Lint
      run: mix format --check-formatted

    - name: Test
      run: mix test

    - name: Upload test results to BuildPulse

      # BuildPulse is most useful when tests FAILED, so run on red builds too.

      if: always()

      uses: BuildPulseLLC/test-reporter-action@v3

      with:

        api-token: ${{ secrets.BUILDPULSE_API_TOKEN }}

        path: .
